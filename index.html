<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E0E0C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EA" media="(prefers-color-scheme: light)">
<title>Spotter · Foro</title>
<meta name="description" content="El foro de Spotter: rutinas, técnica, progreso y marcas personales. Nunca entrenas solo.">
<link rel="icon" href="assets/simbolo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icono-app.png">
<link rel="preload" href="fonts/SpotterDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1 class="sr">Spotter · Foro</h1>
      <picture>
        <source srcset="assets/logo-claro.svg" media="(prefers-color-scheme: light)">
        <img class="logo" src="assets/logo-oscuro.svg" alt="" width="244" height="40">
      </picture>
      <p class="eyebrow">Nunca entrenas solo</p>
      <p class="lead">Pregunta, comparte tus rutinas y celebra tus marcas con gente que entrena como tú.</p>
    </div>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Buscar en el foro</label>
      <input id="q" type="search" placeholder="Buscar temas…" autocomplete="off">
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav aria-label="Categorías">
    <ul class="sleeve" id="cats"></ul>
    <p class="cat-desc" id="catDesc"></p>
  </nav>
  <main id="main"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
